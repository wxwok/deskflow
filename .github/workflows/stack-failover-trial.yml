# Trial package for work: PR #3 stacked on PR #4.
# Version 1.27.1.12, startup tag=stack-failover.
# Pushing this branch builds an Ubuntu 24.04 deb and publishes a prerelease.
# This workflow does not run on master or on wxwok-v* tags.

name: stack-failover trial

on:
  push:
    branches:
      - cursor/stack-failover-trial-64ac
  workflow_dispatch:

concurrency:
  group: stack-failover-trial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DESKFLOW_VERSION: "1.27.1.12"
  DESKFLOW_BUILD_TAG: stack-failover
  RELEASE_TAG: trial-1.27.1.12-stack-failover

jobs:
  ubuntu-2404:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 90
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential cmake ninja-build pkg-config python3-pip python3-venv \
            meson patchelf file dpkg-dev help2man ca-certificates python3-jinja2 \
            libgl1-mesa-dev libglib2.0-dev libssl-dev libx11-dev libxtst-dev \
            libxinerama-dev libxrandr-dev libxi-dev libxkbfile-dev libxkbcommon-dev \
            libxkbregistry-dev libxext-dev libxss-dev libxcursor-dev libxfixes-dev \
            libsm-dev libice-dev gobject-introspection libgirepository1.0-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev

      - name: Build libei 1.4.1 and libportal 0.9.1
        run: |
          git clone --depth 1 --branch 1.4.1 https://gitlab.freedesktop.org/libinput/libei.git /tmp/libei
          meson setup /tmp/libei/build /tmp/libei \
            -Dprefix=/usr/local -Dtests=disabled -Dliboeffis=disabled -Ddocumentation=[]
          meson install -C /tmp/libei/build
          git clone --depth 1 --branch 0.9.1 https://github.com/flatpak/libportal.git /tmp/libportal
          meson setup /tmp/libportal/build /tmp/libportal \
            -Dprefix=/usr/local -Ddocs=false -Dvapi=false \
            -Dbackend-gtk3=disabled -Dbackend-gtk4=disabled \
            -Dbackend-qt5=disabled -Dbackend-qt6=disabled
          meson install -C /tmp/libportal/build
          ldconfig

      - name: Install Qt 6.8.3
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O /opt/qt

      - name: Configure
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
          export LD_LIBRARY_PATH=/opt/qt/6.8.3/gcc_64/lib:/usr/local/lib/x86_64-linux-gnu
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDESKFLOW_FORCE_VERSION="${DESKFLOW_VERSION}" \
            -DPACKAGE_VERSION_LABEL="${DESKFLOW_VERSION}" \
            -DDESKFLOW_BUILD_TAG="${DESKFLOW_BUILD_TAG}" \
            -DQt6_DIR=/opt/qt/6.8.3/gcc_64/lib/cmake/Qt6

      - name: Build
        run: |
          export LD_LIBRARY_PATH=/opt/qt/6.8.3/gcc_64/lib:/usr/local/lib/x86_64-linux-gnu
          cmake --build build --config Release -j"$(nproc)"

      - name: Check version strings
        run: |
          core=$(find build -name deskflow-core -type f | head -1)
          gui=$(find build -name deskflow -type f ! -name '*.so' | head -1)
          test -n "$core"
          grep -a -F 'stack-failover' "$core"
          grep -a -F 'ReleaseAt half-monitor inset + travel edge prefer' "$core"
          grep -a -F '1.27.1.12' "$core"
          grep -a -F 'stack %s+%s' "$core"
          grep -a -F 'stack-failover' "$gui"
          grep -a -F 'ReleaseAt half-monitor inset + travel edge prefer' "$gui"

      - name: Bundle deb
        run: |
          export QT_ROOT=/opt/qt/6.8.3/gcc_64
          export LD_LIBRARY_PATH=/opt/qt/6.8.3/gcc_64/lib:/usr/local/lib/x86_64-linux-gnu
          chmod +x .github/scripts/bundle-ubuntu-deb.sh
          .github/scripts/bundle-ubuntu-deb.sh build "$PWD" "${DESKFLOW_VERSION}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-ubuntu-24.04-stack-failover
          path: deskflow-1.27.1.12-ubuntu-24.04-amd64.deb
          if-no-files-found: error

  release:
    name: pre-release
    needs: ubuntu-2404
    runs-on: ubuntu-24.04
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: pkg-ubuntu-24.04-stack-failover

      - name: Checksums and notes
        run: |
          sha256sum deskflow-1.27.1.12-ubuntu-24.04-amd64.deb | tee SHA256SUMS
          cat > release-notes.md <<'EOF'
          ## deskflow 1.27.1.12 tag=stack-failover

          Ubuntu 24.04 trial package. PR #3 (stacked hover and layer failover) on top of PR #4 (shared-edge return, half-monitor ReleaseAt). Not a merge to the development line.

          Startup log must contain:

          `Deskflow version 1.27.1.12+<sha> tag=stack-failover (ReleaseAt half-monitor inset + travel edge prefer)`

          and the same line for `deskflow-core`. Stack failover lines start with `stack 1.27.1.12+<sha>:`.

          ### Install on work

          Save the official package first:

          ```
          apt-cache policy deskflow | tee /tmp/deskflow-official-policy.txt
          dpkg -l deskflow | tee /tmp/deskflow-official-dpkg.txt
          ```

          Then:

          ```
          sudo systemctl --user stop deskflow || true
          sudo apt-get install -y ./deskflow-1.27.1.12-ubuntu-24.04-amd64.deb
          ```

          ### Roll back

          ```
          sudo apt-get install --allow-downgrades --reinstall deskflow=1.27.1.2
          ```

          If that version string is rejected, use the exact version from `/tmp/deskflow-official-policy.txt`.

          SHA256 is in SHA256SUMS.
          EOF
          # The heredoc above is indented; strip the 10-space prefix from the workflow file.
          sed -i 's/^          //' release-notes.md

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: trial-1.27.1.12-stack-failover
          name: deskflow 1.27.1.12 stack-failover (trial)
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            deskflow-1.27.1.12-ubuntu-24.04-amd64.deb
            SHA256SUMS
