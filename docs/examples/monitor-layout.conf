# Per-monitor layout for an irregular desktop.
# Pointer switching uses section: layout. Links are kept for hotkey-free
# documentation and are ignored for the pointer while the layout is present.
# This file does not load on a build that does not know section: layout.
#
# section: layout is first so the computers are registered before the
# links are parsed. The GUI also registers computers in its settings
# before the core reads the generated file.
#
# work (Ubuntu, server), logical pixels:
#   HDMI-1  1080x1920 at (0, 0)
#   DP-1    3840x2160 at (1080, 0)
#   eDP-1   3840x2160 at (1080, 2160)
#   DP-5    1920x1080 at (4920, 459)
# sur3 sits to the left of eDP-1 and below HDMI-1.
# workwin's laptop sits to the right of eDP-1 and below DP-5.
# dream sits to the right of workwin, top-aligned with the laptop.
#
# The left edge of DP-1 between y=1920 and y=2159 also touches sur3,
# because HDMI-1 does not cover that strip.

section: layout
	work:
		origin = 0, 0
		monitor = HDMI-1, 0, 0, 1080, 1920
		monitor = DP-1, 1080, 0, 3840, 2160
		monitor = eDP-1, 1080, 2160, 3840, 2160
		monitor = DP-5, 4920, 459, 1920, 1080
	sur3:
		origin = -1080, 1920
		monitor = sur3, 0, 0, 2160, 1440
	workwin:
		origin = 4920, 1539
		monitor = laptop, 0, 0, 1920, 1080
		monitor = VX2263, 1920, 0, 1920, 1080
		monitor = Samsung, 3840, 0, 3840, 2160
	dream:
		origin = 12600, 1539
		monitor = dream, 0, 0, 1920, 1080
end

section: links
	work:
		left(0,44) = sur3
		right(10,36) = workwin
	sur3:
		right = work
	workwin:
		left = work
		right = dream
	dream:
		left = workwin
end

section: options
end
